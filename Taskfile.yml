version: '3'

# Shortcuts for the INSTRUMENT-aware make invocations.
# INSTRUMENT must be passed to EVERY make call (including the flash step),
# otherwise the stamp logic switches the profile back to bass and wipes build/.

tasks:
  build:
    desc: Build bass firmware (default profile)
    cmds:
      - make INSTRUMENT=bass

  build-guitar:
    desc: Build guitar firmware
    cmds:
      - make INSTRUMENT=guitar

  flash:
    desc: Build + flash bass firmware via DFU
    cmds:
      - make INSTRUMENT=bass
      - make INSTRUMENT=bass program-dfu

  flash-guitar:
    desc: Build + flash guitar firmware via DFU
    cmds:
      - make INSTRUMENT=guitar
      - make INSTRUMENT=guitar program-dfu

  build-chronotron3:
    desc: Build the ChronoTron3 bundle
    cmds:
      - make PEDAL=chronotron3

  flash-chronotron3:
    desc: Build + flash the ChronoTron3 bundle via DFU
    cmds:
      - make PEDAL=chronotron3
      - make PEDAL=chronotron3 program-dfu

  build-nitrolab:
    desc: Build the NitroLab test-bench bundle
    cmds:
      - make PEDAL=nitrolab

  flash-nitrolab:
    desc: Build + flash the NitroLab test-bench bundle via DFU
    cmds:
      - make PEDAL=nitrolab
      - make PEDAL=nitrolab program-dfu

  flash-nitrolab-diag:
    desc: Build + flash the NitroLab DIAG firmware via DFU (serial log; capture with NAME=nitrolab tools/diag/capture.sh)
    cmds:
      # DIAG=1 on EVERY make call, or the profile stamp wipes build/ and flashes a rebuild without DIAG
      - make PEDAL=nitrolab DIAG=1
      - make PEDAL=nitrolab DIAG=1 program-dfu

  # NitroTron3m (prototype: NitroTron3 on the Module system). INSTRUMENT and
  # NT3M_SLOT_B go on EVERY make call, or the profile stamp wipes build/ and the
  # flash step rebuilds another profile. Guitar: `task flash-nitrotron3m INSTRUMENT=guitar`.
  build-nitrotron3m:
    desc: Build NitroTron3m (slot B = sprawl; INSTRUMENT=bass|guitar, default bass)
    vars:
      INSTRUMENT: '{{.INSTRUMENT | default "bass"}}'
    cmds:
      - make PEDAL=nitrotron3m NT3M_SLOT_B=sprawl INSTRUMENT={{.INSTRUMENT}}

  flash-nitrotron3m:
    desc: Build + flash NitroTron3m (slot B = sprawl) via DFU (INSTRUMENT=bass|guitar, default bass)
    vars:
      INSTRUMENT: '{{.INSTRUMENT | default "bass"}}'
    cmds:
      - make PEDAL=nitrotron3m NT3M_SLOT_B=sprawl INSTRUMENT={{.INSTRUMENT}}
      - make PEDAL=nitrotron3m NT3M_SLOT_B=sprawl INSTRUMENT={{.INSTRUMENT}} program-dfu

  flash-nitrotron3m-armitage:
    desc: Build + flash NitroTron3m with armitage in slot B via DFU (INSTRUMENT=bass|guitar, default bass)
    vars:
      INSTRUMENT: '{{.INSTRUMENT | default "bass"}}'
    cmds:
      - make PEDAL=nitrotron3m NT3M_SLOT_B=armitage INSTRUMENT={{.INSTRUMENT}}
      - make PEDAL=nitrotron3m NT3M_SLOT_B=armitage INSTRUMENT={{.INSTRUMENT}} program-dfu

  clean:
    desc: Remove build output
    cmds:
      - rm -rf build

  catch:
    desc: Retry-flash the already-built binary — start this, then power-cycle the pedal to catch the bootloader window
    cmds:
      - |
        echo "Waiting for the Daisy bootloader... power-cycle the pedal now."
        until dfu-util -a 0 -s 0x90040000:leave -D build/NitroTron3.bin -d ,0483:df11 2>/dev/null; do
          sleep 0.3
        done
        echo "Flashed."

  bootloader:
    desc: One-time flash of the Daisy bootloader (enter DFU mode first)
    cmds:
      - make program-boot

  libs:
    desc: One-time build of libDaisy + DaisySP (after clone/submodule update)
    cmds:
      - make -C lib/HothouseExamples/libDaisy
      - make -C lib/HothouseExamples/DaisySP

  default:
    desc: List available tasks
    cmds:
      - task --list
